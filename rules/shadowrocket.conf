Telegram = select,选择代理,香港节点,日本节点,美国节点,德国节点,手动选择,DIRECT,policy-select-name=美国节点
Twitter = select,选择代理,香港节点,日本节点,美国节点,德国节点,手动选择,DIRECT
新浪微博 = select,DIRECT,香港节点,日本节点,美国节点,德国节点,选择代理,手动选择
Truth Social = select,美国节点,选择代理,手动选择
