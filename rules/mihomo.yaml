  - RULE-SET,CDNResources,静态资源
  - RULE-SET,AdditionalCDNResources,静态资源
  - RULE-SET,OpenAI,AI服务
  - RULE-SET,Gemini,AI服务
  - RULE-SET,Claude,AI服务
  - RULE-SET,BiliBili,哔哩哔哩
