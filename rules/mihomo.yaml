mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

proxies: []

proxy-groups:
  - name: 选择代理
    type: select
    proxies: [自动选择, 故障转移, 香港节点, 日本节点, 美国节点, 德国节点, 手动选择, DIRECT]
  - name: 手动选择
    type: fallback
    url: https://cp.cloudflare.com
    interval: 60
    proxies: [手选节点, 故障转移]
  - name: 手选节点
    type: select
    proxies: []
  - name: 自动选择
    type: url-test
    url: https://cp.cloudflare.com
    interval: 60
    tolerance: 20
    proxies: []
  - name: 故障转移
    type: fallback
    url: https://cp.cloudflare.com
    interval: 60
    proxies: []
  - name: 香港节点
    type: fallback
    url: https://cp.cloudflare.com
    interval: 60
    proxies: [香港自动, 故障转移]
  - name: 日本节点
    type: fallback
    url: https://cp.cloudflare.com
    interval: 60
    proxies: [日本自动, 故障转移]
  - name: 美国节点
    type: fallback
    url: https://cp.cloudflare.com
    interval: 60
    proxies: [美国自动, 故障转移]
  - name: 德国节点
    type: fallback
    url: https://cp.cloudflare.com
    interval: 60
    proxies: [德国自动, 故障转移]
  - name: 香港自动
    type: url-test
    url: https://cp.cloudflare.com
    interval: 60
    tolerance: 20
    proxies: []
  - name: 日本自动
    type: url-test
    url: https://cp.cloudflare.com
    interval: 60
    tolerance: 20
    proxies: []
  - name: 美国自动
    type: url-test
    url: https://cp.cloudflare.com
    interval: 60
    tolerance: 20
    proxies: []
  - name: 德国自动
    type: url-test
    url: https://cp.cloudflare.com
    interval: 60
    tolerance: 20
    proxies: []
  - name: 静态资源
    type: select
    proxies: [选择代理, 香港节点, 日本节点, 美国节点, 德国节点, 手动选择, DIRECT]
  - name: AI服务
